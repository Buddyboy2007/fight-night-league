<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tournament Bracket</title>
<style>
  :root {
    --gold: #f5c542; --hot: #ffb02e; --red: #ff4d57; --ink: #eef2f8; --mute: #8a93a6; --dim: #5b6479;
    --card: #141a29; --card2: #0f1420; --line: rgba(138,147,166,.32);
    --font: 'Fira Sans Condensed', 'Arial Narrow', Arial, sans-serif;
  }
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px;
    background: transparent; overflow: hidden;
    font-family: var(--font); color: var(--ink);
  }

  /* ---------------------------------------------------------------- panel */
  #panel, .dpanel {
    position: absolute; left: 124px; top: 16px; width: 1672px; height: 1048px; box-sizing: border-box;
    border-radius: 18px; border: 1px solid rgba(245,197,66,.28);
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(245,197,66,.10), transparent 70%),
      radial-gradient(700px 500px at 50% 112%, rgba(255,77,87,.07), transparent 70%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.016) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, rgb(11,15,25), rgb(6,8,14));   /* fully opaque: any game bleed-through makes x264 re-encode the panel every frame and smears the text */
    box-shadow: 0 0 0 1px rgba(0,0,0,.7), 0 18px 60px rgba(0,0,0,.65), inset 0 0 90px rgba(0,0,0,.55);
    overflow: hidden;
  }
  #panel::before, .dpanel::before {                                  /* gold top bar */
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, transparent, #b8860b 12%, var(--gold) 50%, #b8860b 88%, transparent);
  }
  #panel::after, .dpanel::after {                                   /* corner brackets */
    content: ''; position: absolute; inset: 10px; pointer-events: none; opacity: .7;
    background:
      linear-gradient(var(--gold), var(--gold)) 0 0 / 30px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 0 0 / 2px 30px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 0 / 30px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 0 / 2px 30px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 0 100% / 30px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 0 100% / 2px 30px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 100% / 30px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 100% / 2px 30px no-repeat;
  }
  #rule { position: absolute; left: 156px; width: 1608px; top: 100px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,197,66,.55) 20%, rgba(245,197,66,.55) 80%, transparent); }

  /* ---------------------------------------------------------------- header */
  #title { position: absolute; left: 184px; top: 28px; }
  #title .eye { font-size: 12px; font-weight: 700; letter-spacing: 5px; color: var(--gold); text-transform: uppercase; }
  #title h1 { margin: 0; font-size: 46px; line-height: 46px; font-weight: 800; font-style: italic; letter-spacing: 2px;
    text-transform: uppercase; color: #fff; text-shadow: 0 2px 14px rgba(245,197,66,.25); }
  #title h1 b { color: var(--gold); font-weight: 800; }
  #title small { display: block; margin-top: 3px; font-size: 12.5px; letter-spacing: 2.5px; color: var(--mute); text-transform: uppercase; font-weight: 500; }

  #now { position: absolute; left: 690px; top: 22px; width: 540px; text-align: center; }
  #now .lbl { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: 5px; color: #1a1204;
    background: linear-gradient(90deg, #d9a21b, var(--gold), #d9a21b); padding: 2px 14px 2px 12px; border-radius: 3px; text-transform: uppercase; }
  #now .lbl i { width: 8px; height: 8px; border-radius: 50%; background: #c4161f; box-shadow: 0 0 8px #ff2a35; animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #now .vs { margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 25px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
  #now .vs span { padding-bottom: 1px; border-bottom: 3px solid var(--tc, var(--gold)); }
  #now .vs em { font-style: italic; font-size: 17px; color: var(--gold); font-weight: 800; }
  #now .sub { font-size: 12.5px; letter-spacing: 3px; color: var(--mute); font-weight: 600; text-transform: uppercase; margin-top: 3px; }

  #legend { position: absolute; right: 190px; top: 32px; display: flex; gap: 14px; }
  .legendItem { display: flex; align-items: center; gap: 8px; width: 104px; }
  .legendItem.out { opacity: .32; }
  .legendItem .lt { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .legendItem .ln { font-size: 15px; font-weight: 700; line-height: 1; letter-spacing: .5px; }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 8px; height: 6px; border-radius: 1px; background: var(--tc); box-shadow: 0 0 5px var(--tc); }
  .pips i.off { background: #2a3144; box-shadow: none; }

  .roundTitle {
    position: absolute; top: 113px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 3px;
    color: #c9a24a; text-transform: uppercase; padding-bottom: 5px;
  }
  .roundTitle::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,162,74,.6), transparent); }

  /* ---------------------------------------------------------------- bout cards */
  .bout {
    position: absolute; box-sizing: border-box; overflow: hidden; border-radius: 7px;
    background: var(--card2); border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .bout.current { border: 2px solid var(--hot); animation: live 1.6s ease-in-out infinite; }
  @keyframes live {
    0%, 100% { box-shadow: 0 0 10px 1px rgba(255,176,46,.5), 0 4px 14px rgba(0,0,0,.45); }
    50%      { box-shadow: 0 0 26px 6px rgba(255,176,46,.85), 0 4px 14px rgba(0,0,0,.45); }
  }
  .bout.final { border-color: rgba(245,197,66,.55); }
  .slot {
    height: var(--sh, 46px); display: flex; align-items: center; gap: 8px; padding-right: 7px; box-sizing: border-box;
    background: linear-gradient(90deg, var(--card), var(--card2)); font-size: 15px; white-space: nowrap; line-height: 1;
    border-left: 5px solid var(--tc, #444a5a); position: relative;
  }
  .slot + .slot { border-top: 1px solid rgba(255,255,255,.06); }
  .bout.current .slot { background: linear-gradient(90deg, #26303f, #19212e); }
  .slot.won { background: linear-gradient(90deg, rgba(245,197,66,.28), rgba(245,197,66,.06) 70%, var(--card2)); }
  .slot.won::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .slot.lost { color: var(--dim); background: var(--card2); }
  .slot.lost .pic img { filter: grayscale(1) brightness(.5); }
  .slot.lost .flag { filter: grayscale(1) brightness(.6); }
  .slot.lost .nm { text-decoration: line-through; text-decoration-color: rgba(255,77,87,.85); text-decoration-thickness: 2px; }
  .slot.tbd { color: #46506a; font-style: italic; background: repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 6px, transparent 6px 12px), var(--card2); }
  .slot.tbd .pic { background: #151b2a; }
  .pic { position: relative; width: var(--sh, 46px); height: var(--sh, 46px); flex-shrink: 0; background: #20283a; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .pic .ini { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: rgba(255,255,255,.92);
    background: linear-gradient(145deg, var(--tc), rgba(0,0,0,.55)); }
  .pic img.flag { position: absolute; left: auto; top: auto; right: 0; bottom: 0; width: 19px !important; height: 13px !important; object-fit: fill; border-radius: 3px 0 0 0; box-shadow: 0 0 0 1px rgba(0,0,0,.65); }
  .nmwrap { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1 1 0; overflow: hidden; line-height: 1.1; }
  .nm { overflow: hidden; text-overflow: ellipsis; font-size: 15.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
  .slot.won .nm { color: #fff; }
  .ko { font-size: 10.5px; font-weight: 800; letter-spacing: 1px; margin-top: 2px; color: var(--red); overflow: hidden; text-overflow: ellipsis; }
  .badge { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; padding: 3px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .slot.lost .badge { filter: none; opacity: .55; }
  .pic .badge.corner { position: absolute; left: 0; top: 0; width: 21px; height: 21px; border-radius: 0 0 7px 0; padding: 3px; box-shadow: 1px 1px 4px rgba(0,0,0,.6); }
  .slot.lost .pic .badge.corner { filter: none; opacity: .6; }
  .legendItem .badge { width: 28px; height: 28px; padding: 5px; }

  .num { position: absolute; font-size: 10.5px; font-weight: 600; color: #6b7590; letter-spacing: 2px; text-transform: uppercase; }
  .num.cur { color: var(--hot); font-weight: 800; }
  .num.cur::after { content: '\00a0\00b7\00a0LIVE'; }

  /* ---------------------------------------------------------------- champion */
  #champ { position: absolute; box-sizing: border-box; text-align: center; border-radius: 12px; padding: 12px 8px;
    background: radial-gradient(130px 110px at 50% 38%, rgba(245,197,66,.14), transparent 75%), linear-gradient(180deg, #151b2a, #0b0f19);
    border: 1px solid rgba(245,197,66,.4); box-shadow: 0 8px 28px rgba(0,0,0,.55); }
  #champ.crowned { border: 2px solid var(--gold); box-shadow: 0 0 40px rgba(245,197,66,.55), 0 8px 28px rgba(0,0,0,.55); }
  #champ .cap { font-size: 13px; letter-spacing: 5px; color: var(--gold); font-weight: 800; }
  #champ .crown { font-size: 22px; line-height: 20px; color: var(--gold); text-shadow: 0 0 14px rgba(245,197,66,.8); }
  #champ .cpic { width: 94px; height: 94px; border-radius: 50%; margin: 9px auto 8px; overflow: hidden; background: #1b2232;
    border: 3px solid #3a4560; display: flex; align-items: center; justify-content: center; font-size: 46px; color: #46506a; font-weight: 800; }
  #champ.crowned .cpic { border-color: var(--gold); box-shadow: 0 0 22px rgba(245,197,66,.7); }
  #champ .cpic img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  #champ .cname { font-size: 21px; font-weight: 800; color: #fff; text-transform: uppercase; line-height: 1.05; }
  #champ .cteam { font-size: 13px; letter-spacing: 2px; color: var(--mute); margin-top: 4px; text-transform: uppercase; font-weight: 600; }

  svg#lines { position: absolute; left: 0; top: 0; }
  svg#lines path { fill: none; stroke: var(--line); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg#lines path.on { stroke: var(--gold); stroke-width: 3; filter: drop-shadow(0 0 5px rgba(245,197,66,.8)); }

  /* ---------------------------------------------------------------- show / hide (the page owns its visibility) */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; visibility: hidden;
    transform: translateY(26px) scale(0.985); transform-origin: 50% 50%;
    transition: opacity .8s ease, transform .8s cubic-bezier(.4,0,.8,.4), visibility 0s linear .8s, filter .6s ease; }
  #stage.show { opacity: 1; visibility: visible; transform: none;
    transition: opacity .9s ease, transform 1s cubic-bezier(.16,.84,.24,1), visibility 0s, filter .6s ease; }
  #stage.dim { filter: brightness(.34) blur(3px); }
  @keyframes boxIn  { from { opacity: 0; transform: translateX(var(--sx, 0px)) translateY(var(--sy, 0px)) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes lineIn { from { opacity: 0; } to { opacity: 1; } }
  #stage.entering .bout, #stage.entering .num, #stage.entering .roundTitle, #stage.entering #champ {
    animation: boxIn .75s cubic-bezier(.16,.84,.24,1) both; animation-delay: var(--d, 0s); }
  #stage.entering svg#lines { animation: lineIn 1.4s ease .5s both; }
  #stage.entering #title, #stage.entering #legend, #stage.entering #now { animation: boxIn .8s ease both; --sy: -14px; }
  #stage.entering #rule { animation: lineIn 1.2s ease .3s both; }

  /* ---------------------------------------------------------------- the next-fight wheel */
  #wheelLayer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; visibility: hidden;
    transition: opacity .7s ease, visibility 0s linear .7s; }
  #wheelLayer.show { opacity: 1; visibility: visible; transition: opacity .7s ease, visibility 0s; }
  #wheelWrap { position: absolute; left: 610px; top: 112px; width: 700px; height: 700px;
    transform: scale(.82); transition: transform .9s cubic-bezier(.16,.84,.24,1); }
  #wheelLayer.show #wheelWrap { transform: none; }
  #wheel { width: 700px; height: 700px; filter: drop-shadow(0 0 38px rgba(245,197,66,.4)) drop-shadow(0 14px 22px rgba(0,0,0,.7)); }
  /* the slices are saturated now, so names get a dark outline rather than relying on a dark fill */
  #wheel text { font-family: var(--font); font-weight: 800; fill: #fff; text-anchor: middle;
    paint-order: stroke fill; stroke: rgba(0,0,0,.72); stroke-width: 4px; stroke-linejoin: round; }
  #wheelLegend { position: absolute; left: 50%; top: 830px; transform: translateX(-50%); display: flex; flex-wrap: wrap;
    justify-content: center; gap: 10px 22px; max-width: 1180px; padding: 12px 26px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(14,18,30,.94), rgba(7,9,15,.94)); border: 1px solid rgba(245,197,66,.45);
    border-radius: 10px; box-shadow: 0 0 26px rgba(0,0,0,.6); }
  #wheelLegend .lg { display: inline-flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 700;
    letter-spacing: 1.5px; color: #dfe6f5; text-transform: uppercase; }
  #wheelLegend .lg i { width: 20px; height: 20px; border-radius: 4px; display: inline-block;
    border: 1px solid rgba(255,255,255,.3); box-shadow: 0 0 8px rgba(0,0,0,.5); }
  #wheelLayer.picked #wheelLegend { opacity: 0; transition: opacity .5s ease; }
  #wheel .bulb { fill: #ffd76a; animation: bulb 1s steps(1) infinite; }
  #wheel .bulb.o { animation-delay: .5s; }
  #wheel.won .bulb { animation-duration: .3s; animation-delay: 0s !important; }
  @keyframes bulb { 0% { opacity: 1; } 50% { opacity: .22; } 100% { opacity: 1; } }
  #pointer { position: absolute; left: 318px; top: -30px; width: 64px; height: 76px; filter: drop-shadow(0 5px 8px rgba(0,0,0,.8)); }
  #hub { position: absolute; left: 285px; top: 285px; width: 130px; height: 130px; border-radius: 50%; box-sizing: border-box;
    background: radial-gradient(circle at 35% 30%, #2a3348, #0a0d15 70%); border: 6px solid var(--gold);
    box-shadow: 0 0 24px rgba(245,197,66,.6), inset 0 0 18px rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; letter-spacing: 3px; line-height: 1.15;
    color: var(--gold); text-align: center; }
  #wheelTitle { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); white-space: nowrap; padding: 8px 40px;
    font-size: 27px; font-weight: 800; letter-spacing: 8px; color: var(--gold); text-transform: uppercase;
    background: linear-gradient(180deg, rgb(14,18,30), rgb(7,9,15)); border: 1px solid rgba(245,197,66,.55); border-radius: 4px;
    box-shadow: 0 0 26px rgba(245,197,66,.3); }
  #pickCard { position: absolute; left: 400px; top: 836px; width: 1120px; height: 190px; box-sizing: border-box; border-radius: 16px;
    border: 2px solid var(--gold); overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 34px;
    background: var(--pc-bg, #0c1019);
    opacity: 0; transform: translateY(46px) scale(.96); transition: opacity .7s ease, transform .8s cubic-bezier(.16,.84,.24,1);
    box-shadow: 0 0 46px rgba(245,197,66,.45), 0 14px 30px rgba(0,0,0,.7); }
  #pickCard.show { opacity: 1; transform: none; }
  #pickCard::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--lc), var(--gold) 50%, var(--rc)); }
  #pickCard .cat { display: inline-block; margin: 5px 0 2px; padding: 3px 11px; border-radius: 999px;
    font-size: 16px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #fff;
    background: var(--cc, #2a3348); border: 1px solid rgba(255,255,255,.28); white-space: nowrap; }
  #pickCard .side { display: flex; align-items: center; gap: 20px; width: 420px; position: relative; }
  #pickCard .side.r { flex-direction: row-reverse; text-align: right; }
  #pickCard .pimg { width: 138px; height: 156px; border-radius: 10px; overflow: hidden; flex-shrink: 0; border: 3px solid var(--tc, #888);
    background: linear-gradient(145deg, var(--tc), #000); box-shadow: 0 0 20px var(--tc); }
  #pickCard .pimg img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  #pickCard .pimg .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 76px; font-weight: 800; color: rgba(255,255,255,.9); }
  #pickCard .nm { font-size: 36px; font-weight: 800; color: #fff; text-transform: uppercase; line-height: 1.02; white-space: normal; overflow: visible; letter-spacing: .5px; }
  #pickCard .tm img { width: 18px; height: 18px; vertical-align: -4px; margin-right: 8px; object-fit: contain; }
  #pickCard .tm { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 3px; font-size: 14px; letter-spacing: 3px; font-weight: 800;
    color: #0a0d14; background: var(--tc, var(--gold)); text-transform: uppercase; }
  #pickCard .mid { text-align: center; position: relative; }
  #pickCard .mid b { display: block; font-size: 58px; line-height: 54px; font-style: italic; color: var(--gold); font-weight: 800; text-shadow: 0 0 22px rgba(245,197,66,.7); }
  #pickCard .mid span { display: inline-block; margin-top: 6px; font-size: 14px; letter-spacing: 4px; color: var(--mute); font-weight: 700; }

  /* ---------------------------------------------------------------- next-tournament draft */
  body.notrans * { transition: none !important; }   /* ?notrans: test screenshots without mid-fade frames */
  #draftLayer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; visibility: hidden;
    transition: opacity .8s ease, visibility 0s linear .8s; }
  #draftLayer.show { opacity: 1; visibility: visible; transition: opacity .8s ease, visibility 0s; }
  #dRule { position: absolute; left: 156px; width: 1608px; top: 100px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,197,66,.55) 20%, rgba(245,197,66,.55) 80%, transparent); }
  #dTitle { position: absolute; left: 184px; top: 28px; }
  #dTitle .eye { font-size: 12px; font-weight: 700; letter-spacing: 5px; color: var(--gold); text-transform: uppercase; }
  #dTitle h1 { margin: 0; font-size: 46px; line-height: 46px; font-weight: 800; font-style: italic; letter-spacing: 2px;
    text-transform: uppercase; color: #fff; text-shadow: 0 2px 14px rgba(245,197,66,.25); }
  #dTitle h1 b { color: var(--gold); font-weight: 800; }
  #dTitle small { display: block; margin-top: 3px; font-size: 12.5px; letter-spacing: 2.5px; color: var(--mute); text-transform: uppercase; font-weight: 500; }
  #dStatus { position: absolute; right: 164px; top: 26px; text-align: right; }
  #dStatus .big { font-size: 34px; line-height: 38px; font-weight: 800; font-style: italic; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
  #dStatus .big span { color: var(--mute); font-size: 22px; }
  #dStatus .chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 2px 12px; border-radius: 3px;
    font-size: 13px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: #0a0d14; background: var(--tc, var(--gold)); }
  #dStatus .chip img { width: 16px; height: 16px; object-fit: contain; }

  #dWheelBox { position: absolute; left: 190px; top: 132px; width: 600px; height: 600px; transition: opacity .6s ease, transform .8s cubic-bezier(.16,.84,.24,1); }
  #dWheelBox.off { opacity: 0; transform: scale(.85); }
  #dWheel { width: 600px; height: 600px; filter: drop-shadow(0 0 34px rgba(245,197,66,.35)) drop-shadow(0 14px 22px rgba(0,0,0,.7)); }
  #dWheel text { font-family: var(--font); font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central;
    paint-order: stroke fill; stroke: rgba(0,0,0,.66); stroke-width: 3.5px; stroke-linejoin: round; }
  #dWheel .bulb { fill: #ffd76a; animation: bulb 1s steps(1) infinite; }
  #dWheel .bulb.o { animation-delay: .5s; }
  #dWheel.won .bulb { animation-duration: .3s; animation-delay: 0s !important; }
  #dWheel.won .sl:not(.win) { opacity: .28; }
  #dPointer { position: absolute; left: 270px; top: -26px; width: 60px; height: 72px; filter: drop-shadow(0 5px 8px rgba(0,0,0,.8)); }
  #dHub { position: absolute; left: 245px; top: 245px; width: 110px; height: 110px; border-radius: 50%; box-sizing: border-box; overflow: hidden;
    background: radial-gradient(circle at 35% 30%, #2a3348, #0a0d15 70%); border: 5px solid var(--gold);
    box-shadow: 0 0 22px rgba(245,197,66,.6), inset 0 0 18px rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; letter-spacing: 3px; line-height: 1.15;
    color: var(--gold); text-align: center; }
  #dHub.logo { background: var(--tc); }
  #dHub img { width: 62px; height: 62px; object-fit: contain; }
  #dCaption { position: absolute; left: 150px; top: 744px; width: 680px; text-align: center; font-size: 25px; font-weight: 800; letter-spacing: 6px;
    color: var(--gold); text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 18px rgba(245,197,66,.35); }
  #dCaption small { display: block; font-size: 13px; letter-spacing: 4px; color: var(--mute); margin-top: 2px; }

  #dIntro { position: absolute; left: 150px; top: 118px; width: 680px; height: 600px; display: flex; flex-direction: column;

  .dhead .did { margin-top: 3px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; color: var(--tc); text-transform: uppercase; line-height: 12px; padding: 0 4px; }
  .dslot { flex: 1; min-height: 0; display: flex; align-items: center; gap: 8px; border-radius: 7px; padding: 0 6px; box-sizing: border-box;
    background: linear-gradient(90deg, var(--tcs), rgba(20,26,41,.9)); border: 1px solid rgba(138,147,166,.16); }

<body>
<div id="stage">
<div id="panel"></div>
<div id="rule"></div>
<div id="title"><div class="eye">Lancero FNF League</div><h1>Tournament <b>Bracket</b></h1><small id="subTitle">32 boxers &middot; 5 AI corners &middot; single elimination</small></div>
<div id="now"></div>
<div id="legend"></div>
<svg id="lines" width="1920" height="1080"></svg>
<div id="board"></div>
</div>
<div id="wheelLayer">
  <div id="wheelTitle">SPINNING FOR THE NEXT FIGHT</div>
  <div id="wheelWrap"><svg id="wheel" viewBox="-350 -350 700 700" style="position:static"></svg>
    <svg id="pointer" viewBox="0 0 64 76"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9a21b"/></linearGradient></defs><path d="M6 4 H58 L58 26 L32 72 L6 26 Z" fill="url(#pg)" stroke="#7a5a0a" stroke-width="3" stroke-linejoin="round"/></svg>
    <div id="hub">NEXT<br>FIGHT</div></div>
  <div id="wheelLegend"></div>
  <div id="pickCard"></div>
</div>

<div id="draftLayer">
  <div class="dpanel"></div>
  <div id="dRule"></div>
  <div id="dTitle"><div class="eye">Lancero FNF League &middot; next tournament</div><h1>Tournament <b id="dNum"></b> Draft</h1><small id="dBand"></small></div>
  <div id="dStatus"></div>
  <div id="dWheelBox" class="off"><svg id="dWheel" viewBox="-310 -310 620 620"></svg>
    <svg id="dPointer" viewBox="0 0 64 76"><defs><linearGradient id="dpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9a21b"/></linearGradient></defs><path d="M6 4 H58 L58 26 L32 72 L6 26 Z" fill="url(#dpg)" stroke="#7a5a0a" stroke-width="3" stroke-linejoin="round"/></svg>
    <div id="dHub"></div></div>
  <div id="dIntro"></div>
  <div id="dCaption"></div>
  <div id="dCard"></div>
  <div id="dCols"></div>
</div>
<script>
const LOAD_ID = Date.now();
const bust = src => src ? src + '?v=' + LOAD_ID : '';

const ROUND_TITLES_BY_SIZE = { 16: 'Round of 16', 8: 'Quarterfinals', 4: 'Semifinals', 2: 'Final' };
// Symmetric bracket: the first half of every round is stacked down the LEFT and flows
// right, the second half is stacked down the RIGHT and flows left, the final sits in the
// middle with the champion above it. Shape is derived from the bout count, so 16/32/64 lay out.
// Round one carries the portraits, so its column is the widest; later rounds narrow down.
const IN_L = 140, IN_R = 1780, TOP = 140, BOT = 1046, GAP = 24, CGAP = 18, CW = 200;
let COLW = [], NC = 4, BOX_H = 92, ROUND_SIZES = [], FEEDERS = {}, ROUND_OF = {}, FIRST = [], CY = {}, SIDE = {}, FINAL = 31;
function layout(nBouts) {
  const field = nBouts + 1;
  ROUND_SIZES = []; FIRST = []; FEEDERS = {}; ROUND_OF = {}; CY = {}; SIDE = {};
  let size = field / 2, first = 1;
  while (size >= 1) { ROUND_SIZES.push(size); FIRST.push(first); first += size; size /= 2; }
  NC = ROUND_SIZES.length - 1; FINAL = nBouts;
  const sideW = (IN_R - IN_L - CW - 2 * CGAP) / 2;
  const weights = Array.from({ length: NC }, (_, r) => r === 0 ? 1.3 : r === 1 ? 1.0 : 0.9);
  const unit = (sideW - GAP * (NC - 1)) / weights.reduce((a, b) => a + b, 0);
  COLW = weights.map(w => Math.floor(w * unit));
  const half0 = ROUND_SIZES[0] / 2, pitch = (BOT - TOP) / half0;
  BOX_H = Math.min(92, Math.floor(pitch - 8));
  ROUND_SIZES.forEach((sz, r) => {
    for (let i = 0; i < sz; i++) {
      const id = FIRST[r] + i; ROUND_OF[id] = r;
      SIDE[id] = r === NC ? 'C' : (i < sz / 2 ? 'L' : 'R');
      if (r === 0) CY[id] = TOP + pitch * ((i % half0) + 0.5);
      else { FEEDERS[id] = [FIRST[r - 1] + 2 * i, FIRST[r - 1] + 2 * i + 1]; CY[id] = (CY[FEEDERS[id][0]] + CY[FEEDERS[id][1]]) / 2; }
    }
  });
}
const colOff = r => COLW.slice(0, r).reduce((a, b) => a + b + GAP, 0);
const colX = (side, r) => side === 'L' ? IN_L + colOff(r) : IN_R - COLW[r] - colOff(r);
const CX = () => (IN_L + IN_R) / 2 - CW / 2;
const TEAM_COLOR = { chatgpt: '#10a37f', claude: '#ff8a1f', gemini: '#22d3ee', codex: '#9b5cf6', grok: '#000000' };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const roundTitle = (r, side) => {
  const sz = ROUND_SIZES[r];
  if (sz * 2 >= 16) {                            // early rounds are counted, not named
    const a = FIRST[r] + (side === 'R' ? sz / 2 : 0);
    return 'Fights ' + a + '–' + (a + sz / 2 - 1);
  }
  return ROUND_TITLES_BY_SIZE[sz * 2] || ('Round of ' + sz * 2);
};
// long names get initials for the first names so they fit a narrow column ("Sugar Ray Robinson" -> "S.R. Robinson")
const _cv = document.createElement('canvas').getContext('2d');
const textW = (t, px) => { _cv.font = '700 ' + px + 'px "Fira Sans Condensed", "Arial Narrow", Arial, sans-serif'; return _cv.measureText(t.toUpperCase()).width + t.length * 0.3; };
// try the full name, then initials + surname, then the surname alone - whichever first fits `avail` px
function shortName(n, avail, px) {
  if (!avail || textW(n, px) <= avail) return n;
  const p = n.split(' ');
  if (p.length < 2) return n;
  const tail = /^(jr\.?|sr\.?)$/i.test(p[p.length - 1]) ? 2 : 1;
  const sur = p.slice(p.length - tail).join(' ');
  const ini = p.slice(0, p.length - tail).map(x => x[0] + '.').join('') + ' ' + sur;
  if (textW(ini, px) <= avail) return ini;
  return sur;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function el(tag, cls, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (parent) parent.appendChild(e);
  return e;
}

function badge(state, tid, parent) {
  const b = el('span', 'badge', parent);
  b.style.background = TEAM_COLOR[tid] || '#666';
  const i = el('img', '', b);
  i.src = bust(state.teams[tid].logo);
  return b;
}

// mirrors gauntlet.result_line(): how the loser went out
function resultLine(result) {
  if (!result) return '';
  const m = (result.method || '').toUpperCase();
  const r = result.round;
  if ((m === 'KO' || m === 'TKO') && r) return m + ' IN ROUND ' + r;
  if (['DEC', 'DECISION', 'UD', 'SD', 'MD'].includes(m)) return 'BY DECISION';
  if (m === 'VOID') return 'VOID · WEIGHT MISMATCH';
  if (r) return 'LOST IN ROUND ' + r;
  return '';
}

function findFighter(state, ref) {
  return state.teams[ref.team].fighters.find(f => f.name === ref.fighter) || {};
}

function slot(state, bout, side, parent, colW, withBadge) {
  const ref = bout[side];
  const s = el('div', 'slot', parent);
  if (ref) s.style.setProperty('--tc', TEAM_COLOR[ref.team] || '#555');
  if (!ref) {
    s.classList.add('tbd');
    el('span', 'pic', s);
    el('span', 'nm', s).textContent = 'TBD';
    return;
  }
  if (bout.winner) s.classList.add(bout.winner === side ? 'won' : 'lost');
  const fx = findFighter(state, ref);
  const pic = el('span', 'pic', s);
  const initial = () => { pic.innerHTML = ''; const d = el('span', 'ini', pic); d.textContent = ref.fighter.split(' ').filter(w => !/^(jr\.?|sr\.?)$/i.test(w)).pop()[0]; };
  const img = el('img', '', pic);
  img.src = bust(ref.image);
  img.onerror = initial;
  if (fx.country) {
    const f = el('img', 'flag', pic);
    f.src = 'flags/' + fx.country + '.svg';
    f.onerror = () => f.remove();
  }
  const wrap = el('span', 'nmwrap', s);
  const nm = el('span', 'nm', wrap); const avail = colW - 5 - BOX_H / 2 - 8 - 7 - (withBadge ? 28 : 0) - 10;
  nm.textContent = shortName(ref.fighter, avail, 15.5);
  { const tw = textW(nm.textContent, 15.5); if (tw > avail) nm.style.fontSize = Math.max(11, 15.5 * avail / tw) + 'px'; } nm.title = ref.fighter;
  if (bout.winner && bout.winner !== side) {
    const txt = resultLine(bout.result);
    if (txt) el('span', 'ko', wrap).textContent = txt;
  }
  const bd = badge(state, ref.team, withBadge ? s : pic);
  if (!withBadge) bd.classList.add('corner');
}

function line(svg, d, on) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  if (on) p.setAttribute('class', 'on');
  svg.appendChild(p);
}

function render(state) {
  const board = document.getElementById('board');
  const svg = document.getElementById('lines');
  board.innerHTML = '';
  svg.innerHTML = '';
  if (state.band && state.band.labels)               // a drafted tournament carries its weight band
    document.getElementById('subTitle').textContent = `${state.bouts.length + 1} boxers · ${state.band.labels.join(' · ')} · single elimination`;

  // legend: the four AI corners and how many fighters each has left, as pips
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  for (const tid of state.team_order) {
    const t = state.teams[tid];
    const item = el('div', 'legendItem' + (t.eliminated ? ' out' : ''), legend);
    item.style.setProperty('--tc', TEAM_COLOR[tid] || '#888');
    badge(state, tid, item);
    const lt = el('div', 'lt', item);
    el('span', 'ln', lt).textContent = t.name;
    const pips = el('div', 'pips', lt);
    t.fighters.forEach(f => el('i', f.eliminated ? 'off' : '', pips));
  }

  layout(state.bouts.length);
  const title = (txt, x, w, y) => {
    const h = el('div', 'roundTitle', board); h.textContent = txt;
    Object.assign(h.style, { left: x + 'px', width: w + 'px' });
    if (y !== undefined) h.style.top = y + 'px';
    h.style.setProperty('--d', '0.05s');
  };
  for (let r = 0; r < NC; r++) { title(roundTitle(r, 'L'), colX('L', r), COLW[r]); title(roundTitle(r, 'R'), colX('R', r), COLW[r]); }

  const cur = state.current_match && state.current_match.bout;
  const nowEl = document.getElementById('now');
  const cm = state.current_match;
  if (cm) {
    const lc = TEAM_COLOR[cm.left.team] || '#888', rc = TEAM_COLOR[cm.right.team] || '#888';
    nowEl.innerHTML = '<div class="lbl"><i></i>Now fighting</div>' +
      '<div class="vs"><span style="--tc:' + lc + '">' + esc(cm.left.fighter) + '</span><em>VS</em><span style="--tc:' + rc + '">' + esc(cm.right.fighter) + '</span></div>' +
      '<div class="sub">' + esc(/^Fight /.test(cm.round) ? cm.round : cm.round + ' · bout ' + cm.bout) + '</div>';
  } else if (state.winner) {
    nowEl.innerHTML = '<div class="lbl">Champion</div><div class="vs"><span>' + esc(state.winner.fighter) + '</span></div>';
  } else nowEl.innerHTML = '';

      const side = (r, cls, c) => `<div class="side ${cls}" style="--tc:${c}"><div class="pimg"><img src="${bust(r.image)}" onerror="this.outerHTML='<div class=ph>${esc(r.fighter[0])}</div>'"></div><div><div class="nm">${esc(r.fighter)}</div>${catChip(r.fighter)}<div class="tm"><img src="${bust(st.teams[r.team].logo)}">${esc(st.teams[r.team].name)}</div></div></div>`;
      const label = (st.current_match && st.current_match.bout === w.pick) ? st.current_match.round : ('Fight ' + w.pick);
      card.style.setProperty('--lc', lc); card.style.setProperty('--rc', rc);
      card.style.setProperty('--pc-bg', `linear-gradient(90deg, ${rgba(lc, .38)}, #0c1019 38%, #0c1019 62%, ${rgba(rc, .38)})`);
      card.innerHTML = side(b.left, 'l', lc) + `<div class="mid"><b>VS</b><span>${esc(label.toUpperCase())}</span></div>` + side(b.right, 'r', rc);
      card.classList.add('show');
    }
    document.getElementById('wheelTitle').textContent = 'NEXT FIGHT';
  }, 1100 + 10000 + 300);
  setTimeout(() => { wheelBusy = false; }, 1100 + 10000 + 3000);
  document.getElementById('wheelTitle').textContent = 'SPINNING FOR THE NEXT FIGHT';
}

// ---------------------------------------------------------------- next-tournament draft
// draft.json is the whole show, planned up front by draft.py: every wheel, what it lands on
// and when. This page only plays it back against the clock (seq = start epoch), so a reload
// or an OBS source refresh mid-draft picks up at the right wheel instead of starting over.
// ?testdraft plays draft.json (or ?draft=<file>) from load time; &at=<s> jumps ahead.
const TEST_DRAFT = Q.has('testdraft');
if (Q.has('notrans')) document.body.classList.add('notrans');
const DSTAT = { p4p: 'P4P', pow: 'PWR', dfn: 'DEF', tec: 'TEC' };
let DRAFT = null, draftKey = '', dSpin = null, draftFetching = false;
const hrand = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const dimg = (src, name) => `<img src="${bust(src)}" onerror="this.outerHTML='<div class=ph>${esc((name || '?')[0])}</div>'">`;
const dflag = cc => cc ? `<img class="flag" src="flags/${esc(cc)}.svg" onerror="this.remove()">` : '';
function splitName(n) {
  const p = n.split(' ');
  if (p.length < 2) return ['', n];
  let tail = /^(jr\.?|sr\.?)$/i.test(p[p.length - 1]) ? 2 : 1;
  while (tail < p.length - 1 && /^(de|la|del|van|von|da|di)$/i.test(p[p.length - tail - 1])) tail++;   // De La Hoya
  return [p.slice(0, p.length - tail).join(' '), p.slice(p.length - tail).join(' ')];
}

async function draftFetch() {
  if (phase !== 'draft' && !TEST_DRAFT) { DRAFT = null; return; }
  if (draftFetching || (TEST_DRAFT && DRAFT)) return;
  draftFetching = true;
  try {
    const r = await fetch((Q.get('draft') || '/draft.json') + '?_=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const d = await r.json();
      if (TEST_DRAFT) d.seq = LOAD_ID / 1000 + 1 - (+Q.get('at') || 0);
      if (!DRAFT || d.seq !== DRAFT.seq) { DRAFT = d; draftKey = ''; }
    }
  } catch (e) {}
  draftFetching = false;
}
setInterval(draftFetch, 1500);
draftFetch();

// slices: [{w, fill, label, sub, img, ink}]; mode: 'radial' (names), 'tangent' (classes), 'team' (logos)
function dWheel(slices, mode, pick, turns, s0, s1, seed, landed) {
  const svg = document.getElementById('dWheel'), R = 288, tot = slices.reduce((a, s) => a + s.w, 0);
  let g = '<circle r="306" fill="#0a0d15" stroke="#f5c542" stroke-width="3"/><circle r="292" fill="none" stroke="#1b2235" stroke-width="2"/>';
  for (let k = 0; k < 28; k++) {
    const a = k * 2 * Math.PI / 28;
    g += `<circle class="bulb ${k % 2 ? 'o' : ''}" cx="${299 * Math.cos(a)}" cy="${299 * Math.sin(a)}" r="4.5"/>`;
  }
  g += '<g id="drot">';
  let acc = 0, win = null;
  const bounds = slices.map((s, i) => slices.slice(0, i).reduce((a, x) => a + x.w, 0) / tot * 360);
  slices.forEach((s, i) => {
    const th0 = acc / tot * 2 * Math.PI, th1 = (acc + s.w) / tot * 2 * Math.PI; acc += s.w;
    if (i === pick) win = [th0, th1];
    const a0 = th0 - Math.PI / 2, a1 = th1 - Math.PI / 2, am = (a0 + a1) / 2, seg = th1 - th0, deg = am * 180 / Math.PI;
    const won = landed && i === pick;
    const fill = won ? '#f5c542' : s.fill, ink = won ? '#1a1204' : (s.ink || '#fff');
    const shape = slices.length === 1 ? `<circle r="${R}" fill="${fill}" stroke="#f5c542" stroke-opacity=".55" stroke-width="2"/>`
      : `<path d="M0 0 L${R * Math.cos(a0)} ${R * Math.sin(a0)} A${R} ${R} 0 ${seg > Math.PI ? 1 : 0} 1 ${R * Math.cos(a1)} ${R * Math.sin(a1)} Z" fill="${fill}" stroke="#f5c542" stroke-opacity="${won ? 1 : .55}" stroke-width="2"/>`;
    let lab = '';
    if (mode === 'radial') {                       // name along the spoke, the corner's stat near the hub
      const fs = Math.max(11, Math.min(24, 0.36 * 215 * seg));     // hug the rim, where the slice is widest
      const nm = shortName(s.label, 168, fs).toUpperCase();
      lab = `<text transform="rotate(${deg}) translate(276 0)" font-size="${fs}" style="fill:${ink};text-anchor:end">${esc(nm)}</text>`;
      if (fs >= 15 && s.sub) lab += `<text transform="rotate(${deg}) translate(84 0)" font-size="12" style="fill:${ink};opacity:.8">${esc(s.sub)}</text>`;
    } else if (mode === 'tangent') {              // class names read across the slice, split if they don't fit
      const r = 190, tx = r * Math.cos(am), ty = r * Math.sin(am), fs = 28;
      const text = s.label.toUpperCase(), lines = textW(text, fs) > r * seg * 0.82 ? text.split(' ') : [text];
      lab = `<text transform="rotate(${deg + 90} ${tx} ${ty})" font-size="${fs}" style="fill:${ink}">` +
        lines.map((l, k) => `<tspan x="${tx}" y="${ty + (k - (lines.length - 1) / 2) * fs * 1.05}">${esc(l)}</tspan>`).join('') + '</text>';
    } else {                                       // team: logo disc + name
      const r = slices.length === 1 ? 0 : 196, cx = r * Math.cos(am), cy = r * Math.sin(am);
      const tr = slices.length === 1 ? 0 : 112, nx = tr * Math.cos(am), ny = tr * Math.sin(am);
      lab = `<circle cx="${cx}" cy="${slices.length === 1 ? -170 : cy}" r="40" fill="#0a0d15" stroke="${won ? '#1a1204' : '#f5c542'}" stroke-width="2"/>` +
        `<image href="${bust(s.img)}" x="${cx - 26}" y="${(slices.length === 1 ? -170 : cy) - 26}" width="52" height="52"/>`;
      if (slices.length === 1) lab += `<text x="0" y="150" font-size="44" style="fill:${ink}">${esc(s.label.toUpperCase())}</text>`;
      else lab += `<text transform="rotate(${deg + 90} ${nx} ${ny})" x="${nx}" y="${ny}" font-size="20" style="fill:${ink}">${esc(s.label.toUpperCase())}</text>`;
    }
    g += `<g class="sl${won ? ' win' : ''}">${shape}${lab}</g>`;
  });
  g += '</g>';
  svg.innerHTML = g;
  svg.classList.toggle('won', !!landed);
  const tw = win || [0, 2 * Math.PI], th = (tw[0] + tw[1]) / 2 + (hrand(seed) - .5) * 0.6 * (tw[1] - tw[0]);
  dSpin = { fin: slices.length === 1 ? 0 : 360 * turns - th * 180 / Math.PI, s0, s1, bounds, last: null };
}

function dHub(html, tc) {
  const h = document.getElementById('dHub');
  h.innerHTML = html; h.classList.toggle('logo', !!tc); h.style.setProperty('--tc', tc || '');
}
function dCaption(main, sub) {
  document.getElementById('dCaption').innerHTML = main ? esc(main) + (sub ? `<small>${esc(sub)}</small>` : '') : '';
}
function dCard(html, tc) {
  const c = document.getElementById('dCard');
  if (!html) { c.classList.remove('show'); return; }
  c.style.setProperty('--tc', tc || '#f5c542');
  c.style.setProperty('--tcbg', rgba(tc || '#f5c542', .34));
  c.innerHTML = html; c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
}
function dStatus(big, chip, tc, logo) {
  document.getElementById('dStatus').innerHTML = `<div class="big">${big}</div>` +
    (chip ? `<div class="chip" style="--tc:${tc || '#f5c542'}">${logo ? `<img src="${bust(logo)}">` : ''}${esc(chip)}</div>` : '');
}
function dCols(shown, clock, roundDone, ids, out) {
  let h = '';
  const per = DRAFT.per || 7;
  ids.forEach(tid => {
    const t = DRAFT.teams[tid];
    const cls = 'dcol' + (tid === out ? ' out' : tid === clock ? ' clock' : roundDone.has(tid) ? ' done' : '');
    h += `<div class="${cls}" style="--tc:${t.color};--tch:${rgba(t.color, .3)};--tcs:${rgba(t.color, .22)}">` +
      `<div class="dhead"><div class="dlogo"><img src="${bust(t.logo)}"></div><div class="dtn">${esc(t.name)}</div><div class="did">${esc(t.identity)}</div></div>`;
    const list = shown[tid] || [];
    for (let k = 0; k < per; k++) {
      const f = list[k];
      if (!f) { h += `<div class="dslot empty${tid === clock && k === list.length ? ' next' : ''}"><span>${k + 1}</span></div>`; continue; }
      const [first, sur] = splitName(f.name), room = per <= 4 ? 80 : (ids.length > 4 ? 94 : 130), big = per <= 4 ? 21 : 19;
      const fs = textW(sur, big) > room ? (textW(sur, 15) > room ? 12.5 : 15) : big;
      const stat = f.tag ? f.tag.toUpperCase() : t.stat ? `${DSTAT[t.stat]} ${f[t.stat]}` : 'WILDCARD';
      h += `<div class="dslot${f.fresh ? ' fresh' : ''}"><div class="dthumb">${dimg(f.image, f.name)}</div>` +
        `<div class="dtx"><div class="df">${esc(first)}</div><div class="ds" style="font-size:${fs}px">${esc(sur)}</div><div class="dst">${esc(f.div)} · ${stat}</div></div></div>`;
    }
    h += '</div>';
  });
  const el = document.getElementById('dCols');
  el.innerHTML = h; el.classList.toggle('p4', per <= 4);
}

function draftRender(i, st, sub) {
  const D = DRAFT, steps = D.steps, field = D.order.length;
  const li = steps.findIndex(s => s.lock), all = Object.keys(D.teams), playing = D.playing || all;
  const locked = i > li || (i === li && sub !== 'T' && sub !== 'TL' && sub !== 'W');
  document.getElementById('dNum').textContent = D.tournament;
  document.getElementById('dBand').textContent = locked
    ? `${D.band_labels.slice().reverse().join(' · ')} · ${field} boxers · single elimination`
    : `4 AI corners draft · one sits out · the first weight-class spin locks the band`;
  const shown = {}, byName = {};
  all.forEach(t => shown[t] = []);
  steps.forEach((s, j) => {
    if (s.kind !== 'pick') return;
    byName[s.fighter.name] = Object.assign({ team: s.team }, s.fighter);
    if (j < i || (j === i && sub === 'C')) shown[s.team].push(Object.assign({ fresh: j === i }, s.fighter));
  });
  const roundDone = new Set();
  let clock = null;
  if (st.kind === 'pick' || st.kind === 'roster') {
    if (sub !== 'T') clock = st.team;
    steps.forEach((s, j) => { if (s.kind === 'roster' && j < i) roundDone.add(s.team); });
  }
  const sitDone = st.kind !== 'intro' && !(st.kind === 'sitout' && sub !== 'L');
  dCols(shown, clock, roundDone, sitDone && !(st.kind === 'sitout') ? playing : all, st.kind === 'sitout' && sub === 'L' ? D.sitout : null);
  const box = document.getElementById('dWheelBox'), intro = document.getElementById('dIntro');
  dSpin = null;

  if (st.kind === 'intro' || st.kind === 'done') {
    box.classList.add('off'); dCaption('');
    if (st.kind === 'intro') {
      intro.innerHTML = `<div class="dbig">The<br><b>Draft</b></div><div class="dlogos">` +
        Object.values(D.teams).map(t => `<div style="--tc:${t.color}"><img src="${bust(t.logo)}"></div>`).join('') +
        `</div><div class="dsub">One corner sits this tournament out.<br>The other four draft their whole rosters in turn.<br>The first weight-class spin locks the band.</div>`;
      dStatus('The draft', 'Tournament ' + D.tournament);
      dCard('');
    } else {
      intro.innerHTML = `<div class="dbig">Draft<br><b>Complete</b></div><div class="dsub">${esc(D.band_labels.slice().reverse().join(' · '))}<br>${field} drafted · the bracket is drawn</div>`;
      dStatus('Draft <b style="color:var(--gold)">complete</b>', `${field} / ${field} picked`);
      const a = byName[D.order[0]], b = byName[D.order[1]];
      if (a && b) {
        const ta = D.teams[a.team], tb = D.teams[b.team];
        const side = (f, t, cls) => `<div class="s ${cls}" style="--tc:${t.color}"><div class="dpimg">${dimg(f.image, f.name)}</div><div><div class="n">${esc(f.name)}</div><div class="t">${esc(t.name)}</div></div></div>`;
        dCard(`<div class="dvs">${side(a, ta, 'l')}<div class="m"><b>VS</b><span>OPENING FIGHT</span></div>${side(b, tb, 'r')}</div>`, '#f5c542');
      }
    }
    intro.classList.add('show');
    return;
  }
  if (st.kind === 'roster') {
    const t = D.teams[st.team], list = shown[st.team], per = D.per || list.length;
    box.classList.add('off'); dCaption(`${t.name}'s roster is set`, `${list.length} boxers · ${t.identity}`);
    intro.innerHTML = `<div class="drhead" style="--tc:${t.color}"><div class="lg"><img src="${bust(t.logo)}"></div>` +
      `<div class="nm">${esc(t.name)}<small>Corner ${st.turn} of 4 · drafted</small></div></div>` +
      `<div class="drgrid${per <= 4 ? ' p4' : ''}" style="--tc:${t.color};--tcs:${rgba(t.color, .3)}">` +
      list.map((f, k) => {
        const [first, sur] = splitName(f.name), fs = textW(sur, 19) > 140 ? (textW(sur, 15) > 140 ? 12.5 : 15) : 19;
        return `<div class="drc" style="animation-delay:${(k * 0.12).toFixed(2)}s"><div class="im">${dimg(f.image, f.name)}</div>` +
          `<div class="tx"><div class="f">${esc(first)}</div><div class="s" style="font-size:${fs}px">${esc(sur)}</div><div class="c">${esc(f.cls || f.div)}</div></div></div>`;
      }).join('') + '</div>';
    dStatus(`${esc(t.name)}<span> · roster</span>`, `Corner ${st.turn} of 4 done`, t.color, t.logo);
    dCard('');
    intro.classList.add('show');
    return;
  }
  intro.classList.remove('show'); box.classList.remove('off');

  if (st.kind === 'sitout') {
    const ids = st.team_items, landed = sub === 'L', t = D.teams[st.team];
    const slices = ids.map(id => ({ w: 1, fill: rgba(D.teams[id].color, .62), label: D.teams[id].name, img: D.teams[id].logo,
                                   ink: id === 'grok' ? '#0a0d14' : '#fff' }));
    dWheel(slices, 'team', st.team_pick, 4, 0.3, st.dur - 2.9, D.seq % 1000 + 19, landed);
    dHub('SITS<br>OUT');
    dStatus('Who sits out?', landed ? t.name + ' sits out' : 'Spinning', landed ? t.color : null, landed ? t.logo : null);
    if (landed) dCaption(`${t.name} sits this one out`, 'The other four corners draft');
    else dCaption('Spinning for the corner that sits out', ids.length < all.length ? 'Last time\'s sit-out is not on the wheel' : 'One corner rests this tournament');
    dCard('');
    return;
  }

  if (st.kind === 'class') {
    const n = st.items.length, reps = Math.max(1, Math.ceil(6 / n)), slices = [];
    for (let r = 0; r < reps; r++) st.items.forEach((it, k) => slices.push({ w: 1, fill: classColor(it.label, WCOL[(r * n + k) % WCOL.length]), label: it.label }));
    const pick = st.pick + n * Math.floor(hrand(D.seq % 1000 + 3) * reps), landed = sub === 'L';
    dWheel(slices, 'tangent', pick, 6, 0.8, 8.4, D.seq % 1000 + 1, landed);
    dHub('LOWEST<br>CLASS');
    dStatus('Weight band', 'Spinning');
    if (landed) {
      const it = st.items[st.pick], cap = it.cap || it.label;
      dCaption(`${it.label} floor · ${cap} cap`);
      dCard(`<div class="dclass"><div class="k">${esc(it.label)} to ${esc(cap)}</div><div class="b">${esc(it.band.slice().reverse().join(' · '))}</div>` +
        `<div class="r">The lowest class is drawn · the cap sits two classes above</div></div>`, '#f5c542');
    } else { dCaption('Spinning for the lowest weight class', st.items.map(x => x.label).join(' · ')); dCard(''); }
    return;
  }

  // pick: corner wheel, then the weight-class wheel, then that corner's fighter wheel, then the pick card
  const t = D.teams[st.team], cEnd = st.team_dur + (st.class_dur || 0), fEnd = cEnd + st.fighter_dur, hold = st.class_hold || 0.5;
  dStatus(sub === 'T' ? `Corner ${st.turn}<span> of 4</span>` : `${esc(t.name)} · Pick ${st.k}<span> / ${st.per}</span>`,
    sub === 'T' ? 'Spinning for the corner' : `On the clock · pick ${st.n} of ${field}`,
    sub === 'T' ? null : t.color, sub === 'T' ? null : t.logo);
  if (sub === 'T' || sub === 'TL') {
    const ids = st.team_items || [st.team], pick = st.team_items ? st.team_pick : 0;
    const slices = ids.map(id => ({ w: 1, fill: rgba(D.teams[id].color, .62), label: D.teams[id].name, img: D.teams[id].logo,
                                   ink: id === 'grok' ? '#0a0d14' : '#fff' }));
    dWheel(slices, 'team', pick, 3, 0.15, st.team_dur - 0.55, st.n * 31 + 7, sub === 'TL');
    dHub('CORNER<br>' + st.turn);
    if (!st.team_items) dCaption('Last corner to draft', `${t.name} drafts ${st.per} in a row`);
    else dCaption(sub === 'TL' ? t.name + ' is on the clock' : 'Spinning for the next corner',
                  sub === 'TL' ? `${st.per} picks in a row · ${t.identity}` : `${ids.length} corners left to draft`);
    dCard('');
    return;
  }
  if ((sub === 'W' || sub === 'WL') && st.lock) {          // the band lock: every class in the game, equal slices
    const its = st.class_items, landed = sub === 'WL', it = its[st.class_pick];
    const slices = its.map((x, k) => ({ w: 1, fill: classColor(x.label, WCOL[k % WCOL.length]), label: x.label }));
    dWheel(slices, 'tangent', st.class_pick, 6, st.team_dur + 0.1, cEnd - hold - 0.05, D.seq % 1000 + 1, landed);
    dHub('WEIGHT<br>BAND');
    if (landed) {
      const b = it.band.slice().reverse(), cap = b[b.length - 1];
      dCaption(b.length > 1 ? `${b[0]} to ${cap}` : `${it.label} only`, `Locked for the whole tournament · ${field} boxers`);
      dCard(`<div class="dclass"><div class="k">${b.length > 1 ? `${esc(b[0])} to ${esc(cap)}` : esc(it.label)}</div><div class="b">${esc(b.join(' · '))}</div>` +
        `<div class="r">${t.name}'s first spin lands on ${esc(it.label)} · the band reaches two classes either side</div></div>`, '#f5c542');
    } else { dCaption('The first spin locks the weight band', its.map(x => x.label).join(' · ')); dCard(''); }
    return;
  }
  if (sub === 'W' || sub === 'WL') {
    const its = st.class_items, n = its.length, reps = n === 1 ? 1 : Math.ceil(6 / n), slices = [];
    // alternate strength rather than hue, so neighbouring slices of the same class stay separable
    for (let r = 0; r < reps; r++) its.forEach((it, k) => slices.push({
      w: it.w,
      fill: _mix(classColor(it.label, t.color), '#0a0d15', (r * n + k) % 2 ? 0 : 0.3),
      label: it.label }));
    const pick = st.class_pick + n * Math.floor(hrand(st.n * 13 + 5) * reps), landed = sub === 'WL', it = its[st.class_pick];
    dWheel(slices, 'tangent', pick, 3, st.team_dur + 0.1, cEnd - hold - 0.05, st.n * 23 + 11, landed);
    if (it.franchise) {                                // Grok: Street Fighter / UFC / Wild Card, not a weight class
      dHub('GROK<br>POOL');
      if (landed) dCaption(`${t.name} drafts ${it.say}`, `${it.left} ${it.noun} left`);
      else dCaption(`Spinning ${t.name}'s pool`, its.map(x => x.label).join(' · '));
      dCard('');
      return;
    }
    dHub('WEIGHT<br>CLASS');
    if (landed) dCaption(`${t.name} drafts a ${it.label.toLowerCase()}`, `${it.left} ${it.label.toLowerCase()}${it.left === 1 ? '' : 's'} left in the pool`);
    else dCaption(`Spinning ${t.name}'s weight class`, its.map(x => x.label).join(' · ') + (its.some(x => x.w !== its[0].w) ? ' · heavier classes get bigger slices' : ''));
    dCard('');
    return;
  }
  const tot = st.items.reduce((a, x) => a + x.w, 0);
  // user 2026-11-23: the boxers who fit the corner's focus are singled out on its board (bright, starred)
  const anyFit = st.items.some(x => x.fit);
  // Every boxer on the board is painted their own colour rather than a shade of the corner's, so the
  // same boxer reads the same on the draft board and on the matchup wheel. The corner's focus is still
  // singled out, but by brightness: a boxer who does not fit is pushed down towards the board's
  // background, which is what the two alternating alphas used to do for all of them at once.
  const slices = st.items.map((x, k) => {
    const c = slotColor(x.name, x.div, t.color);
    const dim = anyFit && !x.fit;
    return { w: Math.max(x.w / tot, 0.045),
      fill: dim ? _mix(c, '#0a0d15', 0.66) : c,
      label: x.name, sub: x.fit ? '★ ' + x.stat : x.stat,
      ink: dim ? 'rgba(255,255,255,.72)' : '#fff' };
  });
  dWheel(slices, 'radial', st.pick, 4, cEnd + 0.1, fEnd - 0.55, st.n * 17 + 3, sub !== 'F');
  dHub(`<img src="${bust(t.logo)}">`, t.color);
  dCaption(`${t.name}'s ${st.fighter.tag || (st.fighter.cls || '').toLowerCase()} board`, t.identity + (t.stat ? ` · ★ ${DSTAT[t.stat]} picks singled out` : ' · every slice equal'));
  if (sub === 'C') {
    const f = st.fighter, odds = Math.round(100 * st.items[st.pick].w / tot);
    const bar = (l, k, v, max) => `<div class="dbar${t.stat === k ? ' key' : ''}"><b>${l}</b><i><s style="width:${100 * v / max}%"></s></i><em>${v}</em></div>`;
    dCard(`<div class="dpimg">${dimg(f.image, f.name)}</div><div class="dinfo">` +
      `<div class="dsel"><img src="${bust(t.logo)}">${esc(t.name)} selects · pick ${st.n}</div>` +
      `<div class="dnm">${esc(shortName(f.name, 440, 40))}</div>` +
      `<div class="dmeta">${dflag(f.country)}${esc(f.cls)} · ${odds}% of the wheel</div>` +
      `<div class="dbars">${bar('PWR', 'pow', f.pow, 10)}${bar('DEF', 'dfn', f.dfn, 10)}${bar('TEC', 'tec', f.tec, 10)}${bar('P4P', 'p4p', f.p4p, 100)}</div></div>`, t.color);
  } else dCard('');
}

function draftFrame() {
  requestAnimationFrame(draftFrame);
  const layer = document.getElementById('draftLayer');
  const on = !!DRAFT && (phase === 'draft' || TEST_DRAFT);
  layer.classList.toggle('show', on);
  if (!on) { draftKey = ''; return; }
  const el = Date.now() / 1000 - DRAFT.seq, steps = DRAFT.steps;
  let i = 0;
  while (i + 1 < steps.length && steps[i + 1].t <= el) i++;
  const st = steps[i], u = Math.max(0, el - st.t);
  let sub = '';
  if (st.kind === 'class') sub = u >= 8.6 ? 'L' : 'S';
  else if (st.kind === 'sitout') sub = u >= st.dur - 2.6 ? 'L' : 'S';
  else if (st.kind === 'pick') {
    const cEnd = st.team_dur + (st.class_dur || 0), fEnd = cEnd + st.fighter_dur;
    sub = u < st.team_dur ? (!st.team_items || u >= st.team_dur - 0.5 ? 'TL' : 'T')
        : u < cEnd ? ((st.class_items || []).length < 2 || u >= cEnd - (st.class_hold || 0.5) ? 'WL' : 'W')
        : u < fEnd - 0.5 ? 'F' : u < fEnd ? 'FL' : 'C';
  }
  const key = i + ':' + sub;
  if (key !== draftKey) { draftKey = key; draftRender(i, st, sub); }
  const rot = document.getElementById('drot');
  if (dSpin && rot) {
    const x = Math.min(1, Math.max(0, (u - dSpin.s0) / (dSpin.s1 - dSpin.s0)));
    const deg = dSpin.fin * (1 - Math.pow(1 - x, 4)), k = sliceAt(deg, dSpin.bounds);
    rot.setAttribute('transform', `rotate(${deg})`);
    if (dSpin.last !== null && k !== dSpin.last) tick();
    dSpin.last = k;
  }
}
requestAnimationFrame(draftFrame);
</script>
